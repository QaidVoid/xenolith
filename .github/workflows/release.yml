name: release

# Builds the tool at a release's tag and attaches it to the release.
# release-plz.yml calls this with the tag it made. Run it by hand to rebuild the
# assets of an existing release.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to build, such as 0.2.0
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: x86_64-linux
    # An older runner, so that the tool runs, and the shader library links, on
    # hosts whose C library is older than the newest.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Build
        run: cargo build --release --locked
      - name: Package
        env:
          TAG: ${{ inputs.tag }}
        run: scripts/package "$TAG" x86_64-linux
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
