[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/QaidVoid/xenolith"
# Released as a binary on GitHub rather than to a registry.
publish = false

[workspace.lints.rust]
# Denied rather than forbidden, and denied everywhere but one module: saying a
# shader while a title runs hands a pointer across to C, which cannot be done
# without it. Forbidding outright would mean a whole crate existing only to hold
# that one boundary.
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
indexing_slicing = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
