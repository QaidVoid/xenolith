[workspace]
# Versions come from git tags rather than a registry, and nothing is published
# to one: a release is a GitHub release carrying the built tool.
git_only = true
dependencies_update = false
pr_labels = ["release"]
semver_check = false
# Only the tool keeps a changelog, and it tells what changed in every crate.
# Every crate finds its last release by the tool's tag, so what the changelog
# gains is only what is new since then.
changelog_update = false
changelog_path = "CHANGELOG.md"
git_tag_name = "v{{ version }}"
# Published releases are immutable here, so a release stays a draft until the
# build has attached its archive and published it.
git_release_draft = true
# Only the tool is tagged and released. The crates it is built from move with
# it in one version group, so a change to any of them releases it.
git_tag_enable = false
git_release_enable = false

[[package]]
name = "xenolith"
version_group = "xenolith"
git_tag_enable = true
git_release_enable = true
changelog_update = true
changelog_include = [
  "xenolith-analysis",
  "xenolith-host",
  "xenolith-lift",
  "xenolith-ppc",
  "xenolith-shader",
  "xenolith-xex",
]

[[package]]
name = "xenolith-analysis"
version_group = "xenolith"

[[package]]
name = "xenolith-host"
version_group = "xenolith"

[[package]]
name = "xenolith-lift"
version_group = "xenolith"

[[package]]
name = "xenolith-ppc"
version_group = "xenolith"

[[package]]
name = "xenolith-shader"
version_group = "xenolith"

[[package]]
name = "xenolith-xex"
version_group = "xenolith"

[changelog]
header = """
"""
body = """
{% macro print_commit(commit) -%}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
        {% if commit.breaking %}[**breaking**] {% endif %}\
        {{ commit.message | upper_first }} - \
        ([{{ commit.id | truncate(length=7, end="") }}]({{ remote.link }}/commit/{{ commit.id }}))\
{% endmacro -%}

{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}]\
          ({{ release_link }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        {{ self::print_commit(commit=commit) }}
    {%- endfor %}
    {% for commit in commits %}
        {%- if not commit.scope -%}
            {{ self::print_commit(commit=commit) }}
        {% endif -%}
    {% endfor -%}
{% endfor -%}
"""
trim = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^refactor\\(clippy\\)", skip = true },
  { message = "^refactor", group = "<!-- 2 -->Refactor" },
  { message = "^doc", group = "<!-- 3 -->Documentation" },
  { message = "^perf", group = "<!-- 4 -->Performance" },
  { message = "^style", group = "<!-- 5 -->Styling" },
  { message = "^test", group = "<!-- 6 -->Testing" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore|^ci", group = "<!-- 7 -->Miscellaneous Tasks" },
  { message = "^revert", group = "<!-- 9 -->Revert" },
]
