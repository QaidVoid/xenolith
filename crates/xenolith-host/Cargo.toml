[package]
name = "xenolith-host"
description = "What a program built by xenolith asks of it while a game runs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
xenolith-shader = { path = "../xenolith-shader" }
xenolith-xex = { path = "../xenolith-xex" }

# A static library, because the program reaching this is C, and a Rust one for
# the tests. It is the one Rust archive a built program links: two would each
# bring a copy of the standard library, and the link would find everything in
# it twice. `tests/c_abi.rs` fails where this line goes missing.
[lib]
crate-type = ["rlib", "staticlib"]

[lints]
workspace = true
