[package]
name = "xenolith-shader"
description = "Disassembler for the shader instruction set of the Xbox 360 graphics processor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]

# A static library as well as a Rust one, because the C side reaches this crate
# through the ABI in `running.rs` and a Rust library alone cannot be linked from
# C. Nothing in the workspace depends on this crate yet, so building another
# package does not produce the archive: it appears when this package is a build
# target. `tests/c_abi.rs` fails where this line goes missing.
[lib]
crate-type = ["rlib", "staticlib"]

[lints]
workspace = true
